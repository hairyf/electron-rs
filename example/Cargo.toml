[package]
name = "electron-rs-examples"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
electron-rs = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[[bin]]
name = "acquisition"
path = "acquisition.rs"

[[bin]]
name = "node-command"
path = "node.rs"

[[bin]]
name = "rpc"
path = "rpc.rs"

[[bin]]
name = "streaming"
path = "streaming.rs"
