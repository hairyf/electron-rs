name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  check:
    name: Checks and real bridge (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libnss3 libgbm1 libasound2t64 xvfb openbox

      - name: Cache cargo and Electron
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/electron
            ~/AppData/Local/electron/Cache
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Install Node dependencies without Electron binaries
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck and build Electron scripts
        run: |
          pnpm run typecheck
          pnpm run build
          git diff --exit-code -- assets

      - name: Test Node regressions
        run: pnpm run test:checks

      - name: Test Rust regressions
        run: cargo test --locked

      - name: Check all Rust targets
        run: cargo check --locked --all-targets

      - name: Check standalone examples
        run: cargo check --locked --manifest-path example/Cargo.toml --all-targets

      # Preparation owns a private distribution and replaces its sandbox modes.
      - name: Prepare real Electron bridge
        run: pnpm run test:bridge:prepare

      - name: Configure the bridge Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root target/electron-bridge/linux-x64/chrome-sandbox
          sudo chmod 4755 target/electron-bridge/linux-x64/chrome-sandbox

      - name: Test real Electron bridge
        if: runner.os != 'Linux'
        run: pnpm run test:bridge

      - name: Test real Electron bridge under a virtual display
        if: runner.os == 'Linux'
        run: >
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24'
          sh -c 'openbox & sleep 1; pnpm run test:bridge'

      - name: Prepare the example distribution
        run: cargo run --locked --manifest-path example/Cargo.toml --bin acquisition

      - name: Configure the example Chromium sandbox
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root example/target/electron/linux-x64/chrome-sandbox
          sudo chmod 4755 example/target/electron/linux-x64/chrome-sandbox

      - name: Run the standalone examples
        if: runner.os != 'Linux'
        run: |
          cargo run --locked --manifest-path example/Cargo.toml --bin node-command
          cargo run --locked --manifest-path example/Cargo.toml --bin rpc
          cargo run --locked --manifest-path example/Cargo.toml --bin streaming

      - name: Run the standalone examples under a virtual display
        if: runner.os == 'Linux'
        run: >
          xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24'
          sh -c 'openbox & sleep 1;
          cargo run --locked --manifest-path example/Cargo.toml --bin node-command &&
          cargo run --locked --manifest-path example/Cargo.toml --bin rpc &&
          cargo run --locked --manifest-path example/Cargo.toml --bin streaming'
