[package]
name = "electron-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Electron acquisition and RPC glue for Rust applications"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "process", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
